# Render Blueprint for the hosted product on free tiers: one Docker web service (Render free plan),
# PostgreSQL on Neon (free), uploaded files in Cloudflare R2 (free). See docs/deploy.md, "Free hosting".
#
# STATUS: written, not yet deployed. Render's free plan sleeps after 15 idle minutes and has no
# persistent disk, which is why files go to R2 and the two server secrets are generated here.
# Values marked `sync: false` are entered once in the Render dashboard; never commit them.
services:
  - type: web
    name: green-computer
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/ready
    autoDeploy: true
    envVars:
      - { key: GC_ENV, value: production }
      - { key: GC_HOSTED, value: "1" }
      - { key: GC_TRUST_PROXY, value: "1" }
      - { key: GC_LOG_FORMAT, value: json }
      - { key: GC_DATA_DIR, value: /data/files }
      - { key: GC_REQUIRE_EMAIL_VERIFICATION, value: "1" }
      - { key: GC_SECRET_KEY, generateValue: true }
      - { key: GC_AGENT_SIGNING_SECRET, generateValue: true }
      # https://<your domain> or https://green-computer.onrender.com; used in email links.
      - { key: GC_PUBLIC_URL, sync: false }
      # Neon connection string as Neon shows it (postgresql://...?sslmode=require).
      - { key: GC_DB_URL, sync: false }
      # Cloudflare R2: endpoint https://<account id>.r2.cloudflarestorage.com, a bucket, an API token's keys.
      - { key: GC_BLOB_BACKEND, value: s3 }
      - { key: GC_S3_ENDPOINT, sync: false }
      - { key: GC_S3_BUCKET, sync: false }
      - { key: GC_S3_ACCESS_KEY_ID, sync: false }
      - { key: GC_S3_SECRET_ACCESS_KEY, sync: false }
      # Email over SMTP (for example Resend: smtp.resend.com, user "resend", password = API key).
      - { key: GC_SMTP_HOST, sync: false }
      - { key: GC_SMTP_USER, sync: false }
      - { key: GC_SMTP_PASSWORD, sync: false }
      - { key: GC_SMTP_FROM, sync: false }
