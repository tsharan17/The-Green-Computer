# Render Blueprint for the hosted product on free tiers: one Docker web service (Render free plan)
# and PostgreSQL on Neon (free), which also holds uploaded files (GC_BLOB_BACKEND=database), so no
# disk or object store is needed. Email goes out through Gmail SMTP. See docs/deploy.md.
#
# Render's free plan sleeps after 15 idle minutes and has no persistent disk, which is why files go to
# the database and the two server secrets are generated here. Only two values are secret and marked
# `sync: false`: they are pasted once in the Render dashboard; never commit them.
services:
  - type: web
    name: the-green-computer
    runtime: docker
    plan: free
    region: ohio  # next to the Neon database (AWS us-east-2)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/ready
    autoDeploy: true
    envVars:
      - { key: GC_ENV, value: production }
      - { key: GC_HOSTED, value: "1" }
      - { key: GC_TRUST_PROXY, value: "1" }
      - { key: GC_LOG_FORMAT, value: json }
      - { key: GC_DATA_DIR, value: /data/files }
      - { key: GC_REQUIRE_EMAIL_VERIFICATION, value: "1" }
      - { key: GC_SECRET_KEY, generateValue: true }
      - { key: GC_AGENT_SIGNING_SECRET, generateValue: true }
      # Used in email links. Render names the address after the service; change it if Render gave a
      # different one, or when a custom domain is added.
      - { key: GC_PUBLIC_URL, value: "https://the-green-computer.onrender.com" }
      - { key: GC_CONTACT_EMAIL, value: shwethasharan.office@gmail.com }
      # Uploaded files and exports live in the database (Neon), not on the container's wiped disk.
      - { key: GC_BLOB_BACKEND, value: database }
      # Secret 1: the Neon connection string as Neon shows it (postgresql://...?sslmode=require).
      - { key: GC_DB_URL, sync: false }
      # Email through Gmail: a Google "app password" for the account below (needs 2-Step Verification).
      - { key: GC_SMTP_HOST, value: smtp.gmail.com }
      - { key: GC_SMTP_PORT, value: "587" }
      - { key: GC_SMTP_USER, value: shwethasharan.office@gmail.com }
      - { key: GC_SMTP_FROM, value: "The Green Computer <shwethasharan.office@gmail.com>" }
      # Secret 2: the 16-letter Gmail app password.
      - { key: GC_SMTP_PASSWORD, sync: false }
