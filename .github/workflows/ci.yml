name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npm run build
  acceptance:
    # Builds the UI, starts the server from a clean (non-dev) install in public-demo mode and runs
    # the judge-style journey against it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cd frontend && npm ci && npm run build
      - run: pip install -e backend
      - run: |
          cd backend
          GC_PUBLIC_DEMO=1 GC_DB_URL=sqlite:////tmp/ci.db uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/v1/health && break || sleep 1; done
          cd .. && python scripts/acceptance.py http://127.0.0.1:8000
